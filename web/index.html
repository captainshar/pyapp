<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Captions</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Speaker marker shapes. Colour alone never identifies a speaker: every
     block also carries one of these shapes and a spelled-out number. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <symbol id="shape-0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
    <symbol id="shape-1" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="4"/></symbol>
    <symbol id="shape-2" viewBox="0 0 24 24"><path d="M12 2 22.4 20.5H1.6Z"/></symbol>
    <symbol id="shape-3" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12Z"/></symbol>
    <symbol id="shape-4" viewBox="0 0 24 24"><path d="M12 1.8 21.8 6.9v10.2L12 22.2 2.2 17.1V6.9Z"/></symbol>
    <symbol id="shape-5" viewBox="0 0 24 24"><path d="M12 1.5 15 9l7.5 0-6 4.9 2.3 7.6L12 16.8 5.2 21.5 7.5 13.9l-6-4.9L9 9Z"/></symbol>
  </defs>
</svg>

<header class="bar" id="bar">
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="dot" id="dot"></span>
    <span id="statusText">Starting&hellip;</span>
  </div>
  <div class="level" aria-hidden="true"><i id="levelFill"></i></div>
</header>

<main id="captions" class="captions" aria-live="polite" aria-label="Live captions"></main>

<!-- Shown before captions arrive, and whenever nobody has spoken in a while. -->
<div class="hint" id="hint" hidden>
  <p id="hintText">Waiting for someone to speak&hellip;</p>
</div>

<!-- Full-screen, unmissable prompts. Only ever one thing to tap. -->
<div class="curtain" id="curtain" hidden>
  <div class="curtain-inner">
    <p class="curtain-title" id="curtainTitle"></p>
    <p class="curtain-body" id="curtainBody"></p>
    <button class="big-button" id="curtainButton" type="button"></button>
  </div>
</div>

<footer class="controls" id="controls">
  <button class="ctl" id="smaller" type="button" aria-label="Smaller text"><span aria-hidden="true">A</span><small aria-hidden="true">&minus;</small></button>
  <button class="ctl" id="bigger" type="button" aria-label="Bigger text"><span class="big" aria-hidden="true">A</span><small aria-hidden="true">+</small></button>
  <button class="ctl wide" id="pause" type="button" aria-label="Pause captions">Pause</button>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
